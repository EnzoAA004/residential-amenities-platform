services:
  postgres:
    image: postgres:18-alpine
    container_name: residential-amenities-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-residential_amenities}
      POSTGRES_USER: ${POSTGRES_USER:-residential_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - residential_amenities_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-residential_app} -d ${POSTGRES_DB:-residential_amenities}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  residential_amenities_pgdata:
