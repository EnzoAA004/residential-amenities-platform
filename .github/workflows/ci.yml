name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-stack:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: residential_amenities
          POSTGRES_USER: residential_app
          POSTGRES_PASSWORD: local_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U residential_app -d residential_amenities"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Restore API solution
        run: dotnet restore apps/api/ResidentialAmenities.slnx

      - name: Build API solution
        run: dotnet build apps/api/ResidentialAmenities.slnx --configuration Release --no-restore

      - name: Validate and apply EF Core migrations
        env:
          ConnectionStrings__Postgres: Host=127.0.0.1;Port=5432;Database=residential_amenities;Username=residential_app;Password=local_dev_only
        run: |
          dotnet ef migrations list \
            --project apps/api/ResidentialAmenities.Api.csproj \
            --context AppDbContext \
            --configuration Release \
            --no-build | tee /tmp/migrations.txt

          grep -q "20260927163000_InitialInfrastructure" /tmp/migrations.txt
          grep -q "20260927171431_BuildingMembershipDomain" /tmp/migrations.txt
          grep -q "20260927173608_IdentityRbacFoundation" /tmp/migrations.txt

          dotnet ef migrations has-pending-model-changes \
            --project apps/api/ResidentialAmenities.Api.csproj \
            --context AppDbContext \
            --configuration Release \
            --no-build

          dotnet ef database update \
            --project apps/api/ResidentialAmenities.Api.csproj \
            --context AppDbContext \
            --configuration Release \
            --no-build

      - name: Run backend tests
        env:
          ConnectionStrings__Postgres: Host=127.0.0.1;Port=5432;Database=residential_amenities;Username=residential_app;Password=local_dev_only;Maximum Pool Size=20
          ASPNETCORE_ENVIRONMENT: Development
        run: dotnet test apps/api/ResidentialAmenities.slnx --configuration Release --no-build

      - name: Start API and verify health/OpenAPI
        env:
          ConnectionStrings__Postgres: Host=127.0.0.1;Port=5432;Database=residential_amenities;Username=residential_app;Password=local_dev_only;Maximum Pool Size=20
          ASPNETCORE_URLS: http://127.0.0.1:8080
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          dotnet run \
            --project apps/api/ResidentialAmenities.Api.csproj \
            --configuration Release \
            --no-build > /tmp/api.log 2>&1 &
          API_PID=$!

          cleanup_api() {
            status=$?
            if [ "$status" -ne 0 ]; then
              cat /tmp/api.log || true
            fi

            if kill -0 "$API_PID" 2>/dev/null; then
              kill "$API_PID"
              wait "$API_PID" || true
            fi

            exit "$status"
          }

          trap cleanup_api EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health > /tmp/health.json; then
              break
            fi
            sleep 2
          done

          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"database":"ok"' /tmp/health.json

          curl --fail --silent \
            http://127.0.0.1:8080/openapi/v1.json > /tmp/openapi.json
          grep -q '"openapi"' /tmp/openapi.json

          trap - EXIT
          if kill -0 "$API_PID" 2>/dev/null; then
            kill "$API_PID"
            wait "$API_PID" || true
          fi

      - name: Setup Node 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: apps/client/package-lock.json

      - name: Install client dependencies
        working-directory: apps/client
        run: npm ci --no-audit --no-fund

      - name: Run client tests
        working-directory: apps/client
        run: npm test

      - name: Build Angular/Ionic client
        working-directory: apps/client
        run: npm run build


  validate-containers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API production image
        run: docker build -f apps/api/Dockerfile -t residential-api:ci .

      - name: Build client production image
        run: docker build -f apps/client/Dockerfile -t residential-client:ci apps/client
