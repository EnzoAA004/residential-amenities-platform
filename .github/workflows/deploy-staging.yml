name: Deploy Azure staging

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan
      confirm_costs:
        description: "I understand that apply creates billable Azure resources"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_environment: "staging"
      TF_VAR_location: "${{ vars.AZURE_LOCATION || 'canadacentral' }}"
      ARM_CLIENT_ID: "${{ secrets.AZURE_CLIENT_ID }}"
      ARM_TENANT_ID: "${{ secrets.AZURE_TENANT_ID }}"
      ARM_SUBSCRIPTION_ID: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"

    steps:
      - name: Guard apply behind explicit cost acknowledgement
        if: "${{ inputs.action == 'apply' && !inputs.confirm_costs }}"
        run: |
          echo "Refusing apply without explicit cost acknowledgement."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: "${{ secrets.AZURE_CLIENT_ID }}"
          tenant-id: "${{ secrets.AZURE_TENANT_ID }}"
          subscription-id: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Install/upgrade Azure Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --yes

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infrastructure/terraform
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=residential-amenities/staging.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: Terraform plan
        working-directory: infrastructure/terraform
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: "${{ inputs.action == 'apply' }}"
        working-directory: infrastructure/terraform
        run: terraform apply -auto-approve tfplan

      - name: Read deployment outputs
        if: "${{ inputs.action == 'apply' }}"
        id: infra
        working-directory: infrastructure/terraform
        run: |
          echo "resource_group=$(terraform output -raw resource_group_name)" >> "$GITHUB_OUTPUT"
          echo "acr_name=$(terraform output -raw acr_name)" >> "$GITHUB_OUTPUT"
          echo "acr_login=$(terraform output -raw acr_login_server)" >> "$GITHUB_OUTPUT"
          echo "api_app=$(terraform output -raw api_container_app_name)" >> "$GITHUB_OUTPUT"
          echo "client_app=$(terraform output -raw client_container_app_name)" >> "$GITHUB_OUTPUT"
          echo "client_url=$(terraform output -raw client_url)" >> "$GITHUB_OUTPUT"

      - name: Authenticate Docker to ACR
        if: "${{ inputs.action == 'apply' }}"
        run: |
          for attempt in {1..12}; do
            if az acr login --name "${{ steps.infra.outputs.acr_name }}"; then
              exit 0
            fi

            echo "Waiting for AcrPush RBAC propagation... ($attempt/12)"
            sleep 10
          done

          echo "ACR login failed after waiting for RBAC propagation."
          exit 1

      - name: Build and push API image
        if: "${{ inputs.action == 'apply' }}"
        run: |
          IMAGE="${{ steps.infra.outputs.acr_login }}/residential-api:${{ github.sha }}"
          docker build --file apps/api/Dockerfile --tag "$IMAGE" .

          for attempt in {1..12}; do
            if docker push "$IMAGE"; then
              exit 0
            fi

            echo "Waiting for AcrPush RBAC propagation before API push... ($attempt/12)"
            sleep 10
            az acr login --name "${{ steps.infra.outputs.acr_name }}" || true
          done

          echo "API image push failed."
          exit 1

      - name: Build and push client image
        if: "${{ inputs.action == 'apply' }}"
        run: |
          IMAGE="${{ steps.infra.outputs.acr_login }}/residential-client:${{ github.sha }}"
          docker build --file apps/client/Dockerfile --tag "$IMAGE" apps/client

          for attempt in {1..12}; do
            if docker push "$IMAGE"; then
              exit 0
            fi

            echo "Waiting for AcrPush RBAC propagation before client push... ($attempt/12)"
            sleep 10
            az acr login --name "${{ steps.infra.outputs.acr_name }}" || true
          done

          echo "Client image push failed."
          exit 1

      - name: Deploy API revision
        if: "${{ inputs.action == 'apply' }}"
        run: |
          az containerapp update \
            --resource-group "${{ steps.infra.outputs.resource_group }}" \
            --name "${{ steps.infra.outputs.api_app }}" \
            --image "${{ steps.infra.outputs.acr_login }}/residential-api:${{ github.sha }}" \
            --output none

      - name: Configure private staging administrator
        if: "${{ inputs.action == 'apply' }}"
        env:
          STAGING_ADMIN_EMAIL: "admin@resamen.local"
          STAGING_ADMIN_PASSWORD: "${{ secrets.STAGING_ADMIN_PASSWORD }}"
        run: |
          if [ -z "$STAGING_ADMIN_PASSWORD" ]; then
            echo "Missing staging environment secret STAGING_ADMIN_PASSWORD."
            echo "Create it in GitHub > Settings > Environments > staging > Environment secrets."
            exit 1
          fi

          az containerapp secret set \
            --resource-group "${{ steps.infra.outputs.resource_group }}" \
            --name "${{ steps.infra.outputs.api_app }}" \
            --secrets "staging-admin-password=$STAGING_ADMIN_PASSWORD" \
            --output none

          az containerapp update \
            --resource-group "${{ steps.infra.outputs.resource_group }}" \
            --name "${{ steps.infra.outputs.api_app }}" \
            --set-env-vars \
              "StagingAdmin__Enabled=true" \
              "StagingAdmin__Email=$STAGING_ADMIN_EMAIL" \
              "StagingAdmin__DisplayName=Administrador" \
              "StagingAdmin__Password=secretref:staging-admin-password" \
            --output none

      - name: Deploy client revision
        if: "${{ inputs.action == 'apply' }}"
        run: |
          az containerapp update \
            --resource-group "${{ steps.infra.outputs.resource_group }}" \
            --name "${{ steps.infra.outputs.client_app }}" \
            --image "${{ steps.infra.outputs.acr_login }}/residential-client:${{ github.sha }}" \
            --output none

      - name: Smoke check public client and proxied API
        if: "${{ inputs.action == 'apply' }}"
        run: |
          CLIENT_URL="${{ steps.infra.outputs.client_url }}"

          for attempt in {1..30}; do
            WEB_STATUS="$(curl --silent --output /tmp/web-health.txt --write-out '%{http_code}' "$CLIENT_URL/healthz" || true)"
            API_STATUS="$(curl --silent --output /tmp/api-health.txt --write-out '%{http_code}' "$CLIENT_URL/api/health" || true)"
            API_BODY="$(cat /tmp/api-health.txt 2>/dev/null || true)"

            if [ "$WEB_STATUS" = "200" ] && [ "$API_STATUS" = "200" ] \
              && printf '%s' "$API_BODY" | grep -q '"status":"ok"'; then
              echo "Staging smoke check passed: $CLIENT_URL"
              exit 0
            fi

            echo "Waiting for revisions... ($attempt/30) web=$WEB_STATUS api=$API_STATUS"
            if [ -n "$API_BODY" ]; then
              echo "API response: $API_BODY"
            fi
            sleep 10
          done

          echo "Staging smoke check failed. Container Apps diagnostics:"
          az containerapp show \
            --resource-group "${{ steps.infra.outputs.resource_group }}" \
            --name "${{ steps.infra.outputs.api_app }}" \
            --query "{provisioningState:properties.provisioningState,latestRevision:properties.latestRevisionName,latestReadyRevision:properties.latestReadyRevisionName,fqdn:properties.configuration.ingress.fqdn}" \
            --output yaml || true
          az containerapp revision list \
            --resource-group "${{ steps.infra.outputs.resource_group }}" \
            --name "${{ steps.infra.outputs.api_app }}" \
            --query "[].{name:name,active:properties.active,health:properties.healthState,provisioning:properties.provisioningState,replicas:properties.replicas}" \
            --output table || true
          az containerapp logs show \
            --resource-group "${{ steps.infra.outputs.resource_group }}" \
            --name "${{ steps.infra.outputs.api_app }}" \
            --type system \
            --tail 80 || true
          exit 1


      - name: Smoke check private staging administrator
        if: "${{ inputs.action == 'apply' }}"
        env:
          STAGING_ADMIN_EMAIL: "admin@resamen.local"
          STAGING_ADMIN_PASSWORD: "${{ secrets.STAGING_ADMIN_PASSWORD }}"
        run: |
          CLIENT_URL="${{ steps.infra.outputs.client_url }}"
          COOKIE_JAR="$(mktemp)"
          LOGIN_BODY="$(mktemp)"
          trap 'rm -f "$COOKIE_JAR" "$LOGIN_BODY"' EXIT

          jq -n \
            --arg email "$STAGING_ADMIN_EMAIL" \
            --arg password "$STAGING_ADMIN_PASSWORD" \
            '{email: $email, password: $password}' > "$LOGIN_BODY"

          curl --fail --silent --show-error \
            --cookie-jar "$COOKIE_JAR" \
            --header "Content-Type: application/json" \
            --data-binary "@$LOGIN_BODY" \
            --request POST \
            "$CLIENT_URL/api/auth/login?useCookies=true" \
            --output /dev/null

          ADMIN_USER="$(curl --fail --silent --show-error \
            --cookie "$COOKIE_JAR" \
            "$CLIENT_URL/api/auth/me")"

          printf '%s' "$ADMIN_USER" | grep -q "\"email\":\"$STAGING_ADMIN_EMAIL\""
          printf '%s' "$ADMIN_USER" | grep -q '"Administrator"'

          curl --fail --silent --show-error \
            --cookie "$COOKIE_JAR" \
            "$CLIENT_URL/api/auth/check/admin" \
            --output /dev/null

          echo "Private staging administrator login passed."

      - name: Smoke check resident demo session
        if: "${{ inputs.action == 'apply' }}"
        run: |
          CLIENT_URL="${{ steps.infra.outputs.client_url }}"
          COOKIE_JAR="$(mktemp)"
          trap 'rm -f "$COOKIE_JAR" /tmp/demo-admin-response.txt' EXIT

          DEMO_STATUS="$(curl --fail --silent --show-error "$CLIENT_URL/api/demo/status")"
          printf '%s' "$DEMO_STATUS" | grep -q '"enabled":true'

          curl --fail --silent --show-error \
            --cookie-jar "$COOKIE_JAR" \
            --request POST \
            "$CLIENT_URL/api/demo/session" \
            --output /dev/null

          DEMO_USER="$(curl --fail --silent --show-error \
            --cookie "$COOKIE_JAR" \
            "$CLIENT_URL/api/auth/me")"

          printf '%s' "$DEMO_USER" | grep -q '"email":"demo.resident@resamen.local"'
          printf '%s' "$DEMO_USER" | grep -q '"Resident"'
          printf '%s' "$DEMO_USER" | grep -q '"unit":"1A"'

          ADMIN_STATUS="$(curl --silent --show-error \
            --cookie "$COOKIE_JAR" \
            --output /tmp/demo-admin-response.txt \
            --write-out '%{http_code}' \
            "$CLIENT_URL/api/auth/check/admin" || true)"

          if [ "$ADMIN_STATUS" != "403" ]; then
            echo "Demo account unexpectedly reached the admin authorization check: HTTP $ADMIN_STATUS"
            cat /tmp/demo-admin-response.txt || true
            exit 1
          fi

          echo "Resident-only one-click demo session passed."
